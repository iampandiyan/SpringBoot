<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Three ways to run a Java server application</text>
  <!-- EJB -->
  <rect x="20" y="50" width="270" height="340" rx="10" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
  <text x="155" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">EJB + Application Server</text>
  <rect x="40" y="95" width="230" height="40" rx="6" fill="#f5c6c0" stroke="#c0392b"/><text x="155" y="120" text-anchor="middle" font-size="13">Your beans (EJB, JPA)</text>
  <rect x="40" y="145" width="230" height="40" rx="6" fill="#f5c6c0" stroke="#c0392b"/><text x="155" y="170" text-anchor="middle" font-size="13">ejb-jar.xml / persistence.xml</text>
  <rect x="40" y="195" width="230" height="70" rx="6" fill="#e8a9a1" stroke="#c0392b"/><text x="155" y="225" text-anchor="middle" font-size="13">WebLogic / JBoss / WebSphere</text><text x="155" y="245" text-anchor="middle" font-size="12">installed and administered separately</text>
  <rect x="40" y="275" width="230" height="40" rx="6" fill="#f5c6c0" stroke="#c0392b"/><text x="155" y="300" text-anchor="middle" font-size="13">JVM + OS</text>
  <text x="155" y="345" text-anchor="middle" font-size="12" fill="#444">Deploy EAR/WAR to the server</text>
  <text x="155" y="365" text-anchor="middle" font-size="12" fill="#444">Heavy, slow to start, hard to test</text>
  <!-- Spring -->
  <rect x="315" y="50" width="270" height="340" rx="10" fill="#fef9ec" stroke="#d68910" stroke-width="2"/>
  <text x="450" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#b9770e">Spring Framework</text>
  <rect x="335" y="95" width="230" height="40" rx="6" fill="#f9e0a8" stroke="#d68910"/><text x="450" y="120" text-anchor="middle" font-size="13">Your beans (POJOs)</text>
  <rect x="335" y="145" width="230" height="40" rx="6" fill="#f9e0a8" stroke="#d68910"/><text x="450" y="170" text-anchor="middle" font-size="13">Spring container: DI, AOP, tx</text>
  <rect x="335" y="195" width="230" height="70" rx="6" fill="#f3cd78" stroke="#d68910"/><text x="450" y="225" text-anchor="middle" font-size="13">YOU configure: XML or Java config</text><text x="450" y="245" text-anchor="middle" font-size="12">pick and align every library version</text>
  <rect x="335" y="275" width="230" height="40" rx="6" fill="#f9e0a8" stroke="#d68910"/><text x="450" y="300" text-anchor="middle" font-size="13">Tomcat installed + JVM + OS</text>
  <text x="450" y="345" text-anchor="middle" font-size="12" fill="#444">Lightweight POJOs, still lots of setup</text>
  <text x="450" y="365" text-anchor="middle" font-size="12" fill="#444">Deploy WAR to Tomcat</text>
  <!-- Boot -->
  <rect x="610" y="50" width="270" height="340" rx="10" fill="#eefaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="745" y="78" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e8449">Spring Boot</text>
  <rect x="630" y="95" width="230" height="40" rx="6" fill="#b9e6c7" stroke="#1e8449"/><text x="745" y="120" text-anchor="middle" font-size="13">Your beans (POJOs)</text>
  <rect x="630" y="145" width="230" height="40" rx="6" fill="#b9e6c7" stroke="#1e8449"/><text x="745" y="170" text-anchor="middle" font-size="13">Spring Framework (same core)</text>
  <rect x="630" y="195" width="230" height="70" rx="6" fill="#86d3a0" stroke="#1e8449"/><text x="745" y="222" text-anchor="middle" font-size="13" font-weight="bold">Boot adds: starters,</text><text x="745" y="242" text-anchor="middle" font-size="13" font-weight="bold">auto-config, Actuator</text>
  <rect x="630" y="275" width="230" height="40" rx="6" fill="#b9e6c7" stroke="#1e8449"/><text x="745" y="300" text-anchor="middle" font-size="13">Embedded Tomcat inside the jar + JVM</text>
  <text x="745" y="345" text-anchor="middle" font-size="12" fill="#444">java -jar app.jar</text>
  <text x="745" y="365" text-anchor="middle" font-size="12" fill="#444">Fast start, container friendly</text>
</svg>
