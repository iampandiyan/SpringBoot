<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Where to start: files to create, in order, and how they link</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="60" width="250" height="56" rx="8" fill="#fdebd0" stroke="#d68910" stroke-width="2"/><text x="155" y="84" font-weight="bold">pom.xml</text><text x="155" y="102">Boot parent + starter-web</text>
    <rect x="330" y="60" width="270" height="56" rx="8" fill="#fdebd0" stroke="#d68910" stroke-width="2"/><text x="465" y="84" font-weight="bold">TradeServiceApplication</text><text x="465" y="102">@SpringBootApplication + main()</text>
    <text x="745" y="82" fill="#555">With only 1 and 2 the app</text><text x="745" y="100" fill="#555">already starts (404 on every URL)</text>

    <rect x="30" y="160" width="250" height="56" rx="8" fill="#f2f3f4" stroke="#7f8c8d" stroke-width="2"/><text x="155" y="184" font-weight="bold">domain/Trade, TradeStatus</text><text x="155" y="202">plain data, no Spring</text>
    <rect x="330" y="160" width="270" height="56" rx="8" fill="#fdebd0" stroke="#d68910" stroke-width="2"/><text x="465" y="184" font-weight="bold">repo/TradeRepository</text><text x="465" y="202">interface (the contract)</text>
    <rect x="650" y="160" width="230" height="56" rx="8" fill="#fdebd0" stroke="#d68910" stroke-width="2"/><text x="765" y="184" font-weight="bold">InMemoryTradeRepository</text><text x="765" y="202">@Repository, implements it</text>

    <rect x="330" y="260" width="270" height="56" rx="8" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/><text x="465" y="284" font-weight="bold">service/TradeService</text><text x="465" y="302">@Service, business rules</text>
    <rect x="330" y="360" width="270" height="56" rx="8" fill="#d6eaf8" stroke="#2874a6" stroke-width="2"/><text x="465" y="384" font-weight="bold">web/TradeController</text><text x="465" y="402">@RestController, HTTP endpoints</text>
    <rect x="30" y="360" width="250" height="56" rx="8" fill="#f9ebea" stroke="#c0392b" stroke-width="2"/><text x="155" y="384" font-weight="bold">TradeServiceTest</text><text x="155" y="402">proves the service, no Spring</text>
  </g>
  <!-- step badges sit on the top-left corner of each box, away from the arrows -->
  <g font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="30" cy="60" r="13" fill="#1a1a1a"/><text x="30" y="65">1</text>
    <circle cx="330" cy="60" r="13" fill="#1a1a1a"/><text x="330" y="65">2</text>
    <circle cx="30" cy="160" r="13" fill="#1a1a1a"/><text x="30" y="165">3</text>
    <circle cx="330" cy="160" r="13" fill="#1a1a1a"/><text x="330" y="165">4</text>
    <circle cx="650" cy="160" r="13" fill="#1a1a1a"/><text x="650" y="165">5</text>
    <circle cx="330" cy="260" r="13" fill="#1a1a1a"/><text x="330" y="265">6</text>
    <circle cx="330" cy="360" r="13" fill="#1a1a1a"/><text x="330" y="365">7</text>
    <circle cx="30" cy="360" r="13" fill="#1a1a1a"/><text x="30" y="365">8</text>
  </g>
  <g stroke="#333" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="330" y1="200" x2="282" y2="200" stroke-dasharray="4 3"/>
    <line x1="650" y1="190" x2="602" y2="190"/>
    <line x1="465" y1="260" x2="465" y2="218"/>
    <line x1="465" y1="360" x2="465" y2="318"/>
    <line x1="330" y1="400" x2="282" y2="400" stroke-dasharray="4 3"/>
  </g>
  <text x="450" y="446" text-anchor="middle" font-size="12" fill="#333">Solid arrow = "injected into / calls" (4 &lt;- 6 &lt;- 7). Dashed = "uses the data type". Arrow 5 to 4 = "implements".</text>
  <text x="450" y="462" text-anchor="middle" font-size="12" fill="#555">Build bottom-up: contract and data first, then logic, then the HTTP edge last.</text>
</svg>
