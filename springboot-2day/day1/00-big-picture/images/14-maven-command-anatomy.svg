<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Anatomy of a Maven command</text>

  <!-- the command line -->
  <rect x="20" y="50" width="860" height="56" rx="8" fill="#2c3e50"/>
  <g font-family="Consolas, monospace" font-size="17">
    <text x="36" y="86" fill="#f5b041">.\mvnw.cmd</text>
    <text x="255" y="86" fill="#58d68d">clean package</text>
    <text x="450" y="86" fill="#85c1e9">spring-boot:run</text>
    <text x="620" y="86" fill="#f1948a">-DskipTests</text>
    <text x="745" y="86" fill="#bb8fce">-Pdev</text>
    <text x="815" y="86" fill="#f7dc6f">-o -q</text>
  </g>

  <!-- connector lines -->
  <g stroke-width="2" fill="none">
    <path d="M90,108 L90,150" stroke="#f5b041"/>
    <path d="M320,108 L320,150" stroke="#58d68d"/>
    <path d="M527,108 L527,150" stroke="#85c1e9"/>
    <path d="M690,108 L690,120 L155,120 L155,290" stroke="none"/>
  </g>
  <text x="640" y="150" font-size="12" fill="#444">Boxes 4 to 6 below match the colours</text>
  <text x="640" y="166" font-size="12" fill="#444">of -D, -P and the flags in the command.</text>

  <!-- boxes -->
  <g font-size="12">
    <rect x="20" y="150" width="190" height="128" rx="8" fill="#fef5e7" stroke="#f5b041" stroke-width="2"/>
    <text x="115" y="172" text-anchor="middle" font-weight="bold">1. The launcher</text>
    <text x="30" y="192">.\mvnw.cmd  Windows wrapper</text>
    <text x="30" y="210">./mvnw       Linux, macOS, Git Bash</text>
    <text x="30" y="228">mvn            installed Maven</text>
    <text x="30" y="250" fill="#555">Wrapper downloads the pinned</text>
    <text x="30" y="264" fill="#555">Maven version for you.</text>

    <rect x="225" y="150" width="190" height="128" rx="8" fill="#eafaf1" stroke="#58d68d" stroke-width="2"/>
    <text x="320" y="172" text-anchor="middle" font-weight="bold">2. Phases (lifecycle)</text>
    <text x="235" y="192">A plain word, no colon.</text>
    <text x="235" y="210">clean, compile, test,</text>
    <text x="235" y="226">package, verify, install</text>
    <text x="235" y="248" fill="#555">Runs that phase AND every</text>
    <text x="235" y="262" fill="#555">phase before it, in order.</text>

    <rect x="430" y="150" width="190" height="128" rx="8" fill="#eaf2f8" stroke="#85c1e9" stroke-width="2"/>
    <text x="525" y="172" text-anchor="middle" font-weight="bold">3. Goals (plugin:goal)</text>
    <text x="440" y="192">Has a colon. Runs ONE task</text>
    <text x="440" y="210">of one plugin, nothing else.</text>
    <text x="440" y="228">spring-boot:run</text>
    <text x="440" y="244">dependency:tree</text>
    <text x="440" y="262" fill="#555">Plugin = a toolbox of goals.</text>
  </g>
  
  <g font-size="12">
    <rect x="20" y="290" width="270" height="170" rx="8" fill="#fdedec" stroke="#f1948a" stroke-width="2"/>
    <text x="155" y="312" text-anchor="middle" font-weight="bold">4. -D  set a property</text>
    <text x="30" y="334">Syntax:  -Dname=value   or  -Dname</text>
    <text x="30" y="354">-DskipTests          skip running tests</text>
    <text x="30" y="372">-Dtest=TradeServiceTest   one test class</text>
    <text x="30" y="390">-Dmaven.test.skip=true   skip compiling</text>
    <text x="30" y="406">  AND running tests</text>
    <text x="30" y="432" fill="#555">PowerShell: quote it if the name has a dot</text>
    <text x="30" y="448" font-family="Consolas, monospace" fill="#555">"-Dspring-boot.run.profiles=dev"</text>

    <rect x="305" y="290" width="270" height="170" rx="8" fill="#f4ecf7" stroke="#bb8fce" stroke-width="2"/>
    <text x="440" y="312" text-anchor="middle" font-weight="bold">5. -P  activate a profile</text>
    <text x="315" y="334">Syntax:  -Pname   or  -Pa,b   or  -P!a</text>
    <text x="315" y="356">A profile is a named group of</text>
    <text x="315" y="372">settings in pom.xml (profiles tag).</text>
    <text x="315" y="394">Example: -Pdev picks dev settings.</text>
    <text x="315" y="416" fill="#555">Check which are active:</text>
    <text x="315" y="432" font-family="Consolas, monospace" fill="#555">mvnw help:active-profiles</text>

    <rect x="590" y="290" width="290" height="170" rx="8" fill="#fef9e7" stroke="#f7dc6f" stroke-width="2"/>
    <text x="735" y="312" text-anchor="middle" font-weight="bold">6. Flags (switches)</text>
    <text x="600" y="334">-o  offline: do not touch the network</text>
    <text x="600" y="352">-q  quiet: only errors</text>
    <text x="600" y="370">-X  debug: very verbose</text>
    <text x="600" y="388">-e  full stack traces on error</text>
    <text x="600" y="406">-U  force re-check of updates</text>
    <text x="600" y="424">-B  batch mode (CI, no colours)</text>
    <text x="600" y="442">-T 1C  one build thread per core</text>
  </g>

  <text x="450" y="486" text-anchor="middle" font-size="12" fill="#444">General form:   mvn [options] [goal | phase] [goal | phase] ...      Phases and goals can be mixed; they run left to right.</text>
</svg>
