<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="b" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e8449"/></marker></defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Which Maven command when? A day in a Spring Boot project</text>

  <g font-size="12">
    <!-- row 1: the loop -->
    <rect x="20" y="55" width="205" height="100" rx="8" fill="#eaf2f8" stroke="#2874a6" stroke-width="2"/>
    <text x="122" y="77" text-anchor="middle" font-weight="bold">Morning: get going</text>
    <text x="30" y="98" font-family="Consolas, monospace">git pull</text>
    <text x="30" y="116" font-family="Consolas, monospace">mvnw clean verify</text>
    <text x="30" y="138" fill="#555">Does the project build and pass</text>
    <text x="30" y="150" fill="#555">before I touch anything?</text>

    <rect x="255" y="55" width="205" height="100" rx="8" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
    <text x="357" y="77" text-anchor="middle" font-weight="bold">Edit, run, try (loop)</text>
    <text x="265" y="98" font-family="Consolas, monospace">mvnw spring-boot:run</text>
    <text x="265" y="116" font-family="Consolas, monospace">curl.exe localhost:8080/...</text>
    <text x="265" y="138" fill="#555">Stop with Ctrl+C, change code,</text>
    <text x="265" y="150" fill="#555">start again.</text>

    <rect x="490" y="55" width="205" height="100" rx="8" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
    <text x="592" y="77" text-anchor="middle" font-weight="bold">Test (loop)</text>
    <text x="500" y="98" font-family="Consolas, monospace">mvnw test</text>
    <text x="500" y="116" font-family="Consolas, monospace">mvnw "-Dtest=MyTest" test</text>
    <text x="500" y="138" fill="#555">Whole suite, or just the class</text>
    <text x="500" y="150" fill="#555">you are working on.</text>

    <rect x="725" y="55" width="155" height="100" rx="8" fill="#fdebd0" stroke="#d68910" stroke-width="2"/>
    <text x="802" y="77" text-anchor="middle" font-weight="bold">Before you push</text>
    <text x="735" y="98" font-family="Consolas, monospace">mvnw clean verify</text>
    <text x="735" y="124" fill="#555">Same check CI will run.</text>
    <text x="735" y="138" fill="#555">Green here = green there.</text>
  </g>
  <g stroke="#333" stroke-width="2" marker-end="url(#a)"><line x1="225" y1="105" x2="253" y2="105"/><line x1="460" y1="105" x2="488" y2="105"/><line x1="695" y1="105" x2="723" y2="105"/></g>
  <path d="M357,158 C357,190 592,190 592,158" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#a)" marker-start="url(#b)"/>
  <text x="475" y="196" text-anchor="middle" font-size="11" fill="#1e8449">repeat many times a day</text>

  <!-- row 2: when something is wrong -->
  <text x="20" y="224" font-size="14" font-weight="bold">When something is wrong</text>
  <g font-size="12">
    <rect x="20" y="236" width="270" height="116" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
    <text x="30" y="258" font-weight="bold">"Class not found" / odd versions</text>
    <text x="30" y="278" font-family="Consolas, monospace">mvnw dependency:tree</text>
    <text x="30" y="296" font-family="Consolas, monospace">  + "-Dincludes=com.fasterxml*"</text>
    <text x="30" y="336" fill="#555">Who pulled this library in?</text>

    <rect x="315" y="236" width="270" height="116" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
    <text x="325" y="258" font-weight="bold">"Could not resolve dependencies"</text>
    <text x="325" y="278" font-family="Consolas, monospace">mvnw -U clean verify</text>
    <text x="325" y="298" fill="#555">-U forces a fresh look at the</text>
    <text x="325" y="312" fill="#555">remote repo. Also check proxy,</text>
    <text x="325" y="326" fill="#555">typos, and a half-downloaded</text>
    <text x="325" y="340" fill="#555">folder in .m2 (delete it).</text>

    <rect x="610" y="236" width="270" height="116" rx="8" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
    <text x="620" y="258" font-weight="bold">Build fails and you cannot see why</text>
    <text x="620" y="278" font-family="Consolas, monospace">mvnw -e clean verify</text>
    <text x="620" y="296" font-family="Consolas, monospace">mvnw -X clean verify</text>
    <text x="620" y="320" fill="#555">-e: full stack trace.</text>
    <text x="620" y="336" fill="#555">-X: debug log (long: search it).</text>
  </g>

  <!-- row 3: occasionally -->
  <text x="20" y="386" font-size="14" font-weight="bold">Now and then</text>
  <g font-size="12">
    <rect x="20" y="398" width="205" height="92" rx="8" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2"/>
    <text x="30" y="418" font-weight="bold">Ship a runnable jar</text>
    <text x="30" y="438" font-family="Consolas, monospace">mvnw clean package</text>
    <text x="30" y="456" font-family="Consolas, monospace">java -jar target\x.jar</text>
    <text x="30" y="478" fill="#555">Add -DskipTests only for speed</text>

    <rect x="245" y="398" width="205" height="92" rx="8" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2"/>
    <text x="255" y="418" font-weight="bold">Share a library locally</text>
    <text x="255" y="438" font-family="Consolas, monospace">mvnw clean install</text>
    <text x="255" y="462" fill="#555">Copies the jar into .m2 so</text>
    <text x="255" y="476" fill="#555">another project can use it.</text>

    <rect x="470" y="398" width="205" height="92" rx="8" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2"/>
    <text x="480" y="418" font-weight="bold">Inspect the build</text>
    <text x="480" y="438" font-family="Consolas, monospace">mvnw help:effective-pom</text>
    <text x="480" y="456" font-family="Consolas, monospace">mvnw dependency:analyze</text>
    <text x="480" y="478" fill="#555">Real config; unused deps</text>

    <rect x="695" y="398" width="185" height="92" rx="8" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2"/>
    <text x="705" y="418" font-weight="bold">Container image</text>
    <text x="705" y="438" font-family="Consolas, monospace">mvnw spring-boot:</text>
    <text x="705" y="454" font-family="Consolas, monospace">  build-image</text>
    <text x="705" y="476" fill="#555">Needs Docker running.</text>
  </g>
</svg>
