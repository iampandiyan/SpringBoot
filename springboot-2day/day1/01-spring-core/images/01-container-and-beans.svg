<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Without a container vs with a container</text>
  <rect x="20" y="50" width="400" height="310" rx="10" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
  <text x="220" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">You wire everything (no IoC)</text>
  <text x="40" y="115" font-size="12" font-family="Consolas, monospace">class TradeController {</text>
  <text x="40" y="135" font-size="12" font-family="Consolas, monospace">  TradeService s = new TradeService(</text>
  <text x="40" y="155" font-size="12" font-family="Consolas, monospace">      new InMemoryTradeRepository());</text>
  <text x="40" y="175" font-size="12" font-family="Consolas, monospace">}</text>
  <text x="40" y="215" font-size="13">Problems:</text>
  <text x="50" y="237" font-size="12">- Controller knows the concrete repository</text>
  <text x="50" y="257" font-size="12">- Swapping to JPA means editing many classes</text>
  <text x="50" y="277" font-size="12">- No place to add tx, timing, security</text>
  <text x="50" y="297" font-size="12">- Tests drag in real dependencies</text>
  <rect x="480" y="50" width="400" height="310" rx="10" fill="#eefaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="680" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8449">The container wires it (IoC)</text>
  <rect x="505" y="95" width="350" height="190" rx="10" fill="#d5f5e3" stroke="#1e8449" stroke-dasharray="6 4"/>
  <text x="680" y="115" text-anchor="middle" font-size="12" font-weight="bold">ApplicationContext (the container)</text>
  <rect x="520" y="130" width="100" height="40" rx="6" fill="#d6eaf8" stroke="#2874a6"/><text x="570" y="155" text-anchor="middle" font-size="11">Controller bean</text>
  <rect x="640" y="130" width="100" height="40" rx="6" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/><text x="690" y="155" text-anchor="middle" font-size="11">Service bean</text>
  <rect x="760" y="130" width="85" height="40" rx="6" fill="#fdebd0" stroke="#d68910"/><text x="802" y="155" text-anchor="middle" font-size="11">Repo bean</text>
  <line x1="620" y1="150" x2="638" y2="150" stroke="#333" stroke-width="2" marker-end="url(#a)"/><line x1="740" y1="150" x2="758" y2="150" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="680" y="200" text-anchor="middle" font-size="11">Each bean declares what it needs (constructor).</text>
  <text x="680" y="218" text-anchor="middle" font-size="11">The container creates ONE of each and injects them.</text>
  <text x="680" y="244" text-anchor="middle" font-size="11" fill="#555">Lookup key: type (and name if needed)</text>
  <text x="680" y="262" text-anchor="middle" font-size="11" fill="#555">EJB analogy: container injection with @EJB</text>
  <text x="500" y="312" font-size="12">Benefits: swap implementations, add proxies, test with fakes.</text>
  <text x="500" y="332" font-size="12">Cost: wiring errors show up at startup, not compile time.</text>
</svg>
