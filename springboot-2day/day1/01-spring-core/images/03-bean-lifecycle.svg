<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Bean lifecycle</text>
  <g font-size="12" text-anchor="middle">
    <rect x="15" y="70" width="115" height="70" rx="8" fill="#eaf2f8" stroke="#2874a6"/><text x="72" y="98" font-weight="bold">1. Instantiate</text><text x="72" y="118">constructor runs</text>
    <rect x="150" y="70" width="115" height="70" rx="8" fill="#eaf2f8" stroke="#2874a6"/><text x="207" y="98" font-weight="bold">2. Inject</text><text x="207" y="118">setters / fields</text>
    <rect x="285" y="70" width="125" height="70" rx="8" fill="#fdebd0" stroke="#d68910"/><text x="347" y="98" font-weight="bold">3. Post-processors</text><text x="347" y="118">before init</text>
    <rect x="430" y="70" width="125" height="70" rx="8" fill="#fdebd0" stroke="#d68910"/><text x="492" y="98" font-weight="bold">4. @PostConstruct</text><text x="492" y="118">your init code</text>
    <rect x="575" y="70" width="150" height="70" rx="8" fill="#f5eef8" stroke="#7d3c98" stroke-width="3"/><text x="650" y="98" font-weight="bold">5. After init</text><text x="650" y="118">AOP PROXY CREATED</text>
    <rect x="745" y="70" width="140" height="70" rx="8" fill="#d5f5e3" stroke="#1e8449"/><text x="815" y="98" font-weight="bold">6. In use</text><text x="815" y="118">serves requests</text>
  </g>
  <g stroke="#333" stroke-width="2" marker-end="url(#a)"><line x1="130" y1="105" x2="148" y2="105"/><line x1="265" y1="105" x2="283" y2="105"/><line x1="410" y1="105" x2="428" y2="105"/><line x1="555" y1="105" x2="573" y2="105"/><line x1="725" y1="105" x2="743" y2="105"/></g>
  <rect x="745" y="175" width="140" height="50" rx="8" fill="#f9ebea" stroke="#c0392b"/><text x="815" y="196" text-anchor="middle" font-size="12" font-weight="bold">7. @PreDestroy</text><text x="815" y="214" text-anchor="middle" font-size="12">on shutdown</text>
  <line x1="815" y1="140" x2="815" y2="173" stroke="#333" stroke-width="2" marker-end="url(#a)" stroke-dasharray="4 3"/>
  <text x="30" y="200" font-size="12">Constructor injection happens at step 1: the object never exists half-wired.</text>
  <text x="30" y="222" font-size="12">Use @PostConstruct for light init only. Heavy work slows startup.</text>
  <text x="30" y="244" font-size="12">Step 5 is why the bean you receive may be a proxy, not your own class.</text>
  <text x="30" y="266" font-size="12" fill="#555">Singleton beans are created at startup (eagerly) by default, so wiring errors fail fast.</text>
</svg>
