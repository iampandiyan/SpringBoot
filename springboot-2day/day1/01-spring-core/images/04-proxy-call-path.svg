<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Normal call: caller to proxy to real object</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="80" width="150" height="80" rx="8" fill="#d6eaf8" stroke="#2874a6" stroke-width="2"/><text x="105" y="112" font-weight="bold">Caller</text><text x="105" y="132">TradeController or</text><text x="105" y="148">DemoRunner</text>
    <rect x="260" y="60" width="260" height="140" rx="10" fill="#f5eef8" stroke="#7d3c98" stroke-width="2"/><text x="390" y="82" font-weight="bold">PROXY</text><text x="390" y="98" font-size="11" font-family="Consolas, monospace">TradeService$$SpringCGLIB$$0</text>
    <rect x="280" y="112" width="220" height="30" rx="6" fill="#e8daef" stroke="#7d3c98"/><text x="390" y="132">TimingAspect.time() starts clock</text>
    <rect x="280" y="150" width="220" height="30" rx="6" fill="#e8daef" stroke="#7d3c98"/><text x="390" y="170">then pjp.proceed()</text>
    <rect x="610" y="80" width="260" height="80" rx="8" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/><text x="740" y="112" font-weight="bold">REAL TradeService</text><text x="740" y="132">create(...) / settle(...)</text><text x="740" y="148" font-size="11" fill="#555">your code, unaware of the aspect</text>
  </g>
  <g stroke="#333" stroke-width="2" marker-end="url(#a)">
    <line x1="180" y1="115" x2="258" y2="115"/><line x1="520" y1="150" x2="608" y2="130"/>
    <path d="M610,155 L525,185" stroke-dasharray="4 3"/><path d="M258,185 L182,150" stroke-dasharray="4 3"/>
  </g>
  <text x="219" y="108" font-size="11" text-anchor="middle">1 call</text><text x="565" y="128" font-size="11" text-anchor="middle">2 proceed</text>
  <text x="567" y="190" font-size="11" text-anchor="middle">3 return</text><text x="218" y="178" font-size="11" text-anchor="middle">4 result</text>
  <rect x="30" y="240" width="840" height="100" rx="10" fill="#fafafa" stroke="#bbb"/>
  <text x="50" y="268" font-size="13" font-weight="bold">This is exactly how @Transactional, @Cacheable, @Retryable and Spring Security method checks work.</text>
  <text x="50" y="292" font-size="12">The "advice" differs (begin/commit a transaction, check a cache, retry on failure) but the mechanism is the same proxy.</text>
  <text x="50" y="314" font-size="12" fill="#555">Seen in our demo log:  service class = TradeService$$SpringCGLIB$$0   and   TradeService.create(..) took 3513 us</text>
</svg>
