<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="450.0" y="30" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Where does a setting come from? Highest wins</text>
<rect x="40" y="55" width="560" height="52" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
<text x="320.0" y="75.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">1. Command line</text>
<text x="320.0" y="95.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">--trade.max-quantity=500</text>
<rect x="40" y="117" width="560" height="52" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
<text x="320.0" y="137.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">2. Environment variable</text>
<text x="320.0" y="157.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">TRADE_MAX_QUANTITY=500   (JWT_SECRET)</text>
<rect x="40" y="179" width="560" height="52" rx="8" fill="#fff8e1" stroke="#c79100" stroke-width="2"/>
<text x="320.0" y="199.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">3. application-{profile}.yml</text>
<text x="320.0" y="219.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">application-prod.yml  (profile chosen at startup)</text>
<rect x="40" y="241" width="560" height="52" rx="8" fill="#fff8e1" stroke="#c79100" stroke-width="2"/>
<text x="320.0" y="261.6666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">4. application.yml</text>
<text x="320.0" y="281.6666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">base file shipped inside the jar</text>
<rect x="40" y="303" width="560" height="52" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="320.0" y="323.6666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">5. Defaults in code</text>
<text x="320.0" y="343.6666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">@DefaultValue, field initialisers</text>
<line x1="640" y1="340" x2="640" y2="70" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="640.0" y="199.0" font-size="12" text-anchor="middle" fill="#444">wins</text>
<text x="660" y="200" font-size="13" text-anchor="start" fill="#1a1a1a">a higher level</text>
<text x="660" y="218" font-size="13" text-anchor="start" fill="#1a1a1a">overrides a lower one</text>
<text x="40" y="385" font-size="13" text-anchor="start" fill="#1a1a1a">Same jar everywhere; only the outside (profile, env vars, arguments) changes. That is a 12-factor application.</text>
</svg>
