<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="900" height="360" fill="#ffffff"/>
<text x="450.0" y="30" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">How /actuator/health decides UP or DOWN</text>
<rect x="30" y="140" width="150" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="105.0" y="169.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">load balancer /</text>
<text x="105.0" y="189.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">Kubernetes probe</text>
<line x1="180" y1="175" x2="250" y2="175" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="215.0" y="169.0" font-size="12" text-anchor="middle" fill="#444">GET</text>
<rect x="250" y="130" width="170" height="90" rx="8" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
<text x="335.0" y="169.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Health endpoint</text>
<text x="335.0" y="189.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">/actuator/health</text>
<rect x="500" y="60" width="190" height="56" rx="8" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="595.0" y="92.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">db  (Hikari / JDBC)</text>
<line x1="420" y1="175" x2="500" y2="88" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="500" y="140" width="190" height="56" rx="8" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="595.0" y="172.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">diskSpace</text>
<line x1="420" y1="175" x2="500" y2="168" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="500" y="220" width="190" height="56" rx="8" fill="#fff8e1" stroke="#c79100" stroke-width="2"/>
<text x="595.0" y="252.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">gateway  (our indicator)</text>
<line x1="420" y1="175" x2="500" y2="248" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="740" y="130" width="130" height="90" rx="8" fill="#f3edfb" stroke="#7e57c2" stroke-width="2"/>
<text x="805.0" y="159.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Aggregate</text>
<text x="805.0" y="179.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">worst status wins:</text>
<text x="805.0" y="199.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">any DOWN = DOWN</text>
<line x1="690" y1="88" x2="740" y2="175" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="690" y1="168" x2="740" y2="175" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="690" y1="248" x2="740" y2="175" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="330" font-size="14" text-anchor="middle" fill="#1a1a1a">UP  -&gt; HTTP 200      DOWN -&gt; HTTP 503  (the load balancer stops sending traffic)</text>
</svg>
