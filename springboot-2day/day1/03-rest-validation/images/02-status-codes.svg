<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="450.0" y="30" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Which failure becomes which HTTP status</text>
<rect x="30" y="50" width="230" height="34" rx="8" fill="#fff8e1" stroke="#c79100" stroke-width="2"/>
<text x="145.0" y="71.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">400 Bad Request</text>
<text x="280" y="73" font-size="14" text-anchor="start" fill="#1a1a1a">malformed JSON, failed @Valid, bad enum in ?status=</text>
<rect x="30" y="91" width="230" height="34" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="145.0" y="112.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">401 Unauthorized</text>
<text x="280" y="114" font-size="14" text-anchor="start" fill="#1a1a1a">no or invalid token (lesson 05)</text>
<rect x="30" y="132" width="230" height="34" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="145.0" y="153.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">403 Forbidden</text>
<text x="280" y="155" font-size="14" text-anchor="start" fill="#1a1a1a">logged in but role not allowed (lesson 05)</text>
<rect x="30" y="173" width="230" height="34" rx="8" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
<text x="145.0" y="194.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">404 Not Found</text>
<text x="280" y="196" font-size="14" text-anchor="start" fill="#1a1a1a">TradeNotFoundException</text>
<rect x="30" y="214" width="230" height="34" rx="8" fill="#fff8e1" stroke="#c79100" stroke-width="2"/>
<text x="145.0" y="235.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">405 Method Not Allowed</text>
<text x="280" y="237" font-size="14" text-anchor="start" fill="#1a1a1a">DELETE /trades/1 (no such mapping)</text>
<rect x="30" y="255" width="230" height="34" rx="8" fill="#f3edfb" stroke="#7e57c2" stroke-width="2"/>
<text x="145.0" y="276.6666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">409 Conflict</text>
<text x="280" y="278" font-size="14" text-anchor="start" fill="#1a1a1a">TradeStateException: settle an already settled trade</text>
<rect x="30" y="296" width="230" height="34" rx="8" fill="#f3edfb" stroke="#7e57c2" stroke-width="2"/>
<text x="145.0" y="317.6666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">422 Unprocessable</text>
<text x="280" y="319" font-size="14" text-anchor="start" fill="#1a1a1a">BusinessRuleException: quantity above the limit</text>
<rect x="30" y="337" width="230" height="34" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
<text x="145.0" y="358.6666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">500 Server Error</text>
<text x="280" y="360" font-size="14" text-anchor="start" fill="#1a1a1a">anything unexpected; generic message, details only in the log</text>
</svg>
