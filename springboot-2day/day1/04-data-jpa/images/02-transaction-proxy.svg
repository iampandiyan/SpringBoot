<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="920" height="420" fill="#ffffff"/>
<text x="460.0" y="30" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">What @Transactional does around a call</text>
<rect x="20" y="150" width="130" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="85.0" y="174.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Caller</text>
<text x="85.0" y="194.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">controller or</text>
<text x="85.0" y="214.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">other bean</text>
<line x1="150" y1="190" x2="230" y2="190" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="230" y="120" width="190" height="140" rx="8" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
<text x="325.0" y="164.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Spring proxy</text>
<text x="325.0" y="184.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">1. open transaction</text>
<text x="325.0" y="204.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">2. call real method</text>
<text x="325.0" y="224.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">3. commit or roll back</text>
<line x1="420" y1="190" x2="500" y2="190" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="500" y="150" width="150" height="80" rx="8" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="575.0" y="184.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">TradeService</text>
<text x="575.0" y="204.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">your code</text>
<line x1="650" y1="190" x2="730" y2="190" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="730" y="150" width="170" height="80" rx="8" fill="#fff8e1" stroke="#c79100" stroke-width="2"/>
<text x="815.0" y="174.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Database</text>
<text x="815.0" y="194.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">one connection,</text>
<text x="815.0" y="214.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">one commit</text>
<rect x="30" y="300" width="410" height="95" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
<text x="235.0" y="323.3333333333333" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Default rollback rules</text>
<text x="235.0" y="342.3333333333333" font-size="13" text-anchor="middle" fill="#1a1a1a">RuntimeException / Error: ROLLBACK</text>
<text x="235.0" y="361.3333333333333" font-size="13" text-anchor="middle" fill="#1a1a1a">checked Exception: COMMIT (!)</text>
<text x="235.0" y="380.3333333333333" font-size="13" text-anchor="middle" fill="#1a1a1a">rollbackFor = Exception.class changes that</text>
<rect x="480" y="300" width="410" height="95" rx="8" fill="#fff8e1" stroke="#c79100" stroke-width="2"/>
<text x="685.0" y="323.3333333333333" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Where it silently does nothing</text>
<text x="685.0" y="342.3333333333333" font-size="13" text-anchor="middle" fill="#1a1a1a">this.other() skips the proxy: no new transaction</text>
<text x="685.0" y="361.3333333333333" font-size="13" text-anchor="middle" fill="#1a1a1a">private / final methods: not intercepted</text>
<text x="685.0" y="380.3333333333333" font-size="13" text-anchor="middle" fill="#1a1a1a">lazy field read outside a transaction: error</text>
</svg>
