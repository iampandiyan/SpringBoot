<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="940" height="430" fill="#ffffff"/>
<text x="470.0" y="30" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Two filter chains, two jobs</text>
<rect x="20" y="170" width="130" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="85.0" y="199.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">every HTTP</text>
<text x="85.0" y="219.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">request</text>
<line x1="150" y1="205" x2="220" y2="205" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="220" y="165" width="170" height="80" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="305.0" y="199.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">securityMatcher</text>
<text x="305.0" y="219.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">which path?</text>
<line x1="390" y1="185" x2="470" y2="95" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="420" y="130" font-size="12" text-anchor="middle" fill="#444">/auth/**</text>
<line x1="390" y1="225" x2="470" y2="335" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="410" y="300" font-size="12" text-anchor="middle" fill="#444">everything else</text>
<rect x="470" y="50" width="220" height="90" rx="8" fill="#fff8e1" stroke="#c79100" stroke-width="2"/>
<text x="580.0" y="79.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Chain 1: tokenChain</text>
<text x="580.0" y="99.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">HTTP Basic</text>
<text x="580.0" y="119.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">username + password</text>
<line x1="690" y1="95" x2="760" y2="95" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="760" y="55" width="160" height="80" rx="8" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="840.0" y="89.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">TokenController</text>
<text x="840.0" y="109.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">returns a signed JWT</text>
<rect x="470" y="290" width="220" height="110" rx="8" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
<text x="580.0" y="319.6666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Chain 2: apiChain</text>
<text x="580.0" y="339.6666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">Bearer token required</text>
<text x="580.0" y="359.6666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">verify signature + expiry</text>
<text x="580.0" y="379.6666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">roles -&gt; authorities</text>
<line x1="690" y1="345" x2="760" y2="345" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="760" y="305" width="160" height="80" rx="8" fill="#f3edfb" stroke="#7e57c2" stroke-width="2"/>
<text x="840.0" y="329.6666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Controller</text>
<text x="840.0" y="349.6666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">@PreAuthorize</text>
<text x="840.0" y="369.6666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">hasRole(&#x27;OPS&#x27;)</text>
<text x="30" y="425" font-size="14" text-anchor="start" fill="#1a1a1a">401 = we do not know who you are.   403 = we know, and the answer is no.</text>
</svg>
