<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="900" height="430" fill="#ffffff"/>
<text x="450.0" y="30" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Our test pyramid: many fast tests, few slow ones</text>
<rect x="285.0" y="55" width="330" height="72" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
<text x="450.0" y="77.0" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">HTTP</text>
<text x="450.0" y="95.0" font-size="12" text-anchor="middle" fill="#1a1a1a">TradeHttpTest  (3)</text>
<text x="450.0" y="113.0" font-size="12" text-anchor="middle" fill="#1a1a1a">real Tomcat, random port</text>
<rect x="225.0" y="140" width="450" height="72" rx="8" fill="#fff8e1" stroke="#c79100" stroke-width="2"/>
<text x="450.0" y="162.0" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Integration</text>
<text x="450.0" y="180.0" font-size="12" text-anchor="middle" fill="#1a1a1a">SecurityTest, TradeApiTest, ActuatorTest, ...</text>
<text x="450.0" y="198.0" font-size="12" text-anchor="middle" fill="#1a1a1a">whole context, MockMvc</text>
<rect x="165.0" y="225" width="570" height="72" rx="8" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
<text x="450.0" y="247.0" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Slice</text>
<text x="450.0" y="265.0" font-size="12" text-anchor="middle" fill="#1a1a1a">TradeControllerTest, JpaTradeRepositoryTest</text>
<text x="450.0" y="283.0" font-size="12" text-anchor="middle" fill="#1a1a1a">only web OR only JPA</text>
<rect x="105.0" y="310" width="690" height="72" rx="8" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="450.0" y="332.0" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Unit</text>
<text x="450.0" y="350.0" font-size="12" text-anchor="middle" fill="#1a1a1a">TradeServiceMockTest, validation, fake repository</text>
<text x="450.0" y="368.0" font-size="12" text-anchor="middle" fill="#1a1a1a">no Spring, milliseconds</text>
<text x="30" y="405" font-size="13" text-anchor="start" fill="#1a1a1a">Rule of thumb: test each rule at the LOWEST level that can show it fail. Keep a few top-level journeys as a safety net.</text>
</svg>
