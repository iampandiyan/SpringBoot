<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="450.0" y="30" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">One call to the gateway: how the three annotations nest</text>
<rect x="40" y="55" width="820" height="300" rx="10" fill="#fff8e1" stroke="#c79100" stroke-width="2"/>
<text x="52" y="77" font-size="14" text-anchor="start" fill="#1a1a1a" font-weight="bold">@Retry  (outermost: repeats a failed attempt, owns the fallback)</text>
<rect x="80" y="100" width="740" height="230" rx="10" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
<text x="92" y="122" font-size="14" text-anchor="start" fill="#1a1a1a" font-weight="bold">@CircuitBreaker  (counts attempts, refuses calls while OPEN)</text>
<rect x="120" y="145" width="660" height="160" rx="10" fill="#f3edfb" stroke="#7e57c2" stroke-width="2"/>
<text x="132" y="167" font-size="14" text-anchor="start" fill="#1a1a1a" font-weight="bold">@Bulkhead  (at most N calls in flight)</text>
<rect x="180" y="190" width="540" height="80" rx="8" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
<text x="450.0" y="214.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ResilientGatewayClient.confirm</text>
<text x="450.0" y="234.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">gateway.send(&quot;T7&quot;, trade)</text>
<text x="450.0" y="254.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">the real remote call</text>
<text x="450" y="385" font-size="13" text-anchor="middle" fill="#1a1a1a">Fixed order, outermost first: Retry( CircuitBreaker( Bulkhead( call ) ) ). Put the fallback on the OUTERMOST one.</text>
</svg>
