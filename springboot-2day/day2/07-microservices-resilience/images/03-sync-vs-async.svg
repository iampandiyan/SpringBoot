<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="450.0" y="30" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Two ways services talk, and what each costs</text>
<rect x="30" y="55" width="410" height="300" rx="10" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
<text x="42" y="77" font-size="14" text-anchor="start" fill="#1a1a1a" font-weight="bold">Synchronous (HTTP / gRPC)</text>
<rect x="55" y="110" width="120" height="60" rx="8" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
<text x="115.0" y="144.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">Trade</text>
<rect x="290" y="110" width="120" height="60" rx="8" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
<text x="350.0" y="144.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">Settlement</text>
<line x1="175" y1="140" x2="290" y2="140" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="232.5" y="134.0" font-size="12" text-anchor="middle" fill="#444">request</text>
<line x1="290" y1="160" x2="175" y2="160" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="232.5" y="154.0" font-size="12" text-anchor="middle" fill="#444">reply</text>
<text x="55" y="215" font-size="13" text-anchor="start" fill="#1a1a1a">+ simple, immediate answer</text>
<text x="55" y="240" font-size="13" text-anchor="start" fill="#1a1a1a">- both must be up at the same moment</text>
<text x="55" y="265" font-size="13" text-anchor="start" fill="#1a1a1a">- latency and failures add up along the chain</text>
<text x="55" y="290" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">=&gt; needs timeout, retry, circuit breaker</text>
<rect x="460" y="55" width="410" height="300" rx="10" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="472" y="77" font-size="14" text-anchor="start" fill="#1a1a1a" font-weight="bold">Asynchronous (events / messages)</text>
<rect x="485" y="110" width="100" height="60" rx="8" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="535.0" y="144.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">Trade</text>
<rect x="620" y="110" width="100" height="60" rx="8" fill="#fff8e1" stroke="#c79100" stroke-width="2"/>
<text x="670.0" y="144.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">Broker</text>
<rect x="755" y="110" width="100" height="60" rx="8" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="805.0" y="144.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">Settlement</text>
<line x1="585" y1="140" x2="620" y2="140" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="720" y1="140" x2="755" y2="140" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="485" y="215" font-size="13" text-anchor="start" fill="#1a1a1a">+ sender does not wait, survives downtime</text>
<text x="485" y="240" font-size="13" text-anchor="start" fill="#1a1a1a">+ absorbs bursts, easy to add consumers</text>
<text x="485" y="265" font-size="13" text-anchor="start" fill="#1a1a1a">- eventual consistency, harder to debug</text>
<text x="485" y="290" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">=&gt; needs idempotent consumers, outbox</text>
</svg>
