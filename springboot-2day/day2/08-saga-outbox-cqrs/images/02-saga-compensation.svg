<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="900" height="420" fill="#ffffff"/>
<text x="450.0" y="30" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Saga: local steps forward, compensations backward</text>
<rect x="40" y="90" width="240" height="70" rx="8" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="160.0" y="119.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">1. reserve cash</text>
<text x="160.0" y="139.66666666666669" font-size="14" text-anchor="middle" fill="#1a1a1a">undo: release cash</text>
<rect x="330" y="90" width="240" height="70" rx="8" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="450.0" y="119.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">2. deliver securities</text>
<text x="450.0" y="139.66666666666669" font-size="14" text-anchor="middle" fill="#1a1a1a">undo: take back</text>
<rect x="620" y="90" width="240" height="70" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
<text x="740.0" y="119.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">3. confirm gateway</text>
<text x="740.0" y="139.66666666666669" font-size="14" text-anchor="middle" fill="#1a1a1a">pivot: nothing to undo</text>
<line x1="280" y1="125" x2="330" y2="125" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="570" y1="125" x2="620" y2="125" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="595" y="112" font-size="12" text-anchor="middle" fill="#444">FAILS</text>
<line x1="740" y1="160" x2="740" y2="230" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="560" y="230" width="300" height="56" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
<text x="710.0" y="252.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">rollBack()</text>
<text x="710.0" y="272.66666666666663" font-size="14" text-anchor="middle" fill="#1a1a1a">trade -&gt; FAILED, event TradeSettlementFailed</text>
<line x1="560" y1="258" x2="450" y2="258" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="250" y="230" width="200" height="56" rx="8" fill="#fff8e1" stroke="#c79100" stroke-width="2"/>
<text x="350.0" y="252.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">compensate</text>
<text x="350.0" y="272.66666666666663" font-size="14" text-anchor="middle" fill="#1a1a1a">undo step 2</text>
<line x1="250" y1="258" x2="140" y2="258" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<rect x="40" y="230" width="100" height="56" rx="8" fill="#fff8e1" stroke="#c79100" stroke-width="2"/>
<text x="90.0" y="252.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">compensate</text>
<text x="90.0" y="272.66666666666663" font-size="14" text-anchor="middle" fill="#1a1a1a">undo step 1</text>
<text x="40" y="330" font-size="13" text-anchor="start" fill="#1a1a1a">Each step commits locally and the saga saves its progress (saga_instance.next_step).</text>
<text x="40" y="352" font-size="13" text-anchor="start" fill="#1a1a1a">A crash leaves state RUNNING; resume() continues from the saved step.</text>
<text x="40" y="374" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">Steps and compensations must be idempotent. The last step is the pivot: after it, nothing may fail.</text>
</svg>
