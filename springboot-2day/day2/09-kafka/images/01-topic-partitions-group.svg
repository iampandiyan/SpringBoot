<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="900" height="460" fill="#ffffff"/>
<text x="450.0" y="30" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Kafka in one picture: topic, partitions, consumer group</text>
<rect x="30" y="80" width="150" height="70" rx="8" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
<text x="105.0" y="99.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Producer</text>
<text x="105.0" y="119.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">TradeSettled</text>
<text x="105.0" y="139.66666666666669" font-size="14" text-anchor="middle" fill="#1a1a1a">key = trade id</text>
<rect x="230" y="55" width="360" height="250" rx="10" fill="#fff8e1" stroke="#c79100" stroke-width="2"/>
<text x="242" y="77" font-size="14" text-anchor="start" fill="#1a1a1a" font-weight="bold">Topic  trade-events  (3 partitions)</text>
<rect x="250" y="95" width="320" height="50" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="410.0" y="124.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a" font-family="Consolas, Menlo, monospace">0  1  2  3  4 ...  (offsets, append-only)</text>
<text x="256" y="109" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="bold">partition 0</text>
<rect x="250" y="165" width="320" height="50" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="410.0" y="194.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a" font-family="Consolas, Menlo, monospace">0  1  2  3  4 ...  (offsets, append-only)</text>
<text x="256" y="179" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="bold">partition 1</text>
<rect x="250" y="235" width="320" height="50" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="410.0" y="264.6666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a" font-family="Consolas, Menlo, monospace">0  1  2  3  4 ...  (offsets, append-only)</text>
<text x="256" y="249" font-size="11" text-anchor="start" fill="#1a1a1a" font-weight="bold">partition 2</text>
<line x1="180" y1="115" x2="250" y2="120" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="180" y1="125" x2="250" y2="190" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="180" y1="135" x2="250" y2="260" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="175" font-size="12" text-anchor="start" fill="#1a1a1a">the partition is chosen by</text>
<text x="30" y="192" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="bold">hash(key) % 3</text>
<rect x="640" y="55" width="240" height="250" rx="10" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="652" y="77" font-size="14" text-anchor="start" fill="#1a1a1a" font-weight="bold">Consumer group  trade-report</text>
<rect x="660" y="95" width="200" height="50" rx="8" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="760.0" y="114.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">consumer A</text>
<text x="760.0" y="134.66666666666669" font-size="14" text-anchor="middle" fill="#1a1a1a">reads partition 0</text>
<rect x="660" y="165" width="200" height="50" rx="8" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="760.0" y="184.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">consumer B</text>
<text x="760.0" y="204.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">reads partitions 1, 2</text>
<line x1="570" y1="120" x2="660" y2="120" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="570" y1="190" x2="660" y2="190" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="570" y1="260" x2="660" y2="190" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="340" font-size="13" text-anchor="start" fill="#1a1a1a">One partition is an ordered log. Equal keys always land in the same partition, so one trade&#x27;s events stay in order.</text>
<text x="30" y="362" font-size="13" text-anchor="start" fill="#1a1a1a">Inside a group each partition is read by exactly ONE consumer: more partitions = more parallelism (never more consumers than partitions).</text>
<text x="30" y="384" font-size="13" text-anchor="start" fill="#1a1a1a">Another group (say, an e-mail sender) gets its own full copy of every record. Each group tracks its own offset per partition.</text>
<text x="30" y="416" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="bold">Records are kept for a retention period (default 7 days) whether or not anyone has read them.</text>
</svg>
