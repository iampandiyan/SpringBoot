<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="900" height="440" fill="#ffffff"/>
<text x="450.0" y="30" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">The Kubernetes objects in k8s/ and how they point at each other</text>
<rect x="40" y="60" width="190" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="135.0" y="84.83333333333333" font-size="13" text-anchor="middle" fill="#1a1a1a">Ingress / gateway</text>
<text x="135.0" y="103.83333333333333" font-size="13" text-anchor="middle" fill="#1a1a1a">(not in this lesson)</text>
<rect x="40" y="170" width="190" height="70" rx="8" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="135.0" y="199.83333333333334" font-size="13" text-anchor="middle" fill="#1a1a1a">Service</text>
<text x="135.0" y="218.83333333333334" font-size="13" text-anchor="middle" fill="#1a1a1a">stable name + port 80</text>
<rect x="300" y="60" width="220" height="70" rx="8" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
<text x="410.0" y="89.83333333333333" font-size="13" text-anchor="middle" fill="#1a1a1a">Deployment</text>
<text x="410.0" y="108.83333333333333" font-size="13" text-anchor="middle" fill="#1a1a1a">replicas: 2, rolling update</text>
<rect x="300" y="170" width="220" height="60" rx="8" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
<text x="410.0" y="194.83333333333334" font-size="13" text-anchor="middle" fill="#1a1a1a">ReplicaSet (created by</text>
<text x="410.0" y="213.83333333333334" font-size="13" text-anchor="middle" fill="#1a1a1a">the Deployment)</text>
<rect x="300" y="280" width="100" height="80" rx="8" fill="#fff8e1" stroke="#c79100" stroke-width="2"/>
<text x="350.0" y="306.0" font-size="12" text-anchor="middle" fill="#1a1a1a">Pod 1</text>
<text x="350.0" y="324.0" font-size="12" text-anchor="middle" fill="#1a1a1a">app container</text>
<text x="350.0" y="342.0" font-size="12" text-anchor="middle" fill="#1a1a1a">8080</text>
<rect x="420" y="280" width="100" height="80" rx="8" fill="#fff8e1" stroke="#c79100" stroke-width="2"/>
<text x="470.0" y="306.0" font-size="12" text-anchor="middle" fill="#1a1a1a">Pod 2</text>
<text x="470.0" y="324.0" font-size="12" text-anchor="middle" fill="#1a1a1a">app container</text>
<text x="470.0" y="342.0" font-size="12" text-anchor="middle" fill="#1a1a1a">8080</text>
<rect x="600" y="60" width="260" height="60" rx="8" fill="#f3edfb" stroke="#7e57c2" stroke-width="2"/>
<text x="730.0" y="94.33333333333333" font-size="13" text-anchor="middle" fill="#1a1a1a">ConfigMap: profiles, URLs</text>
<rect x="600" y="140" width="260" height="60" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
<text x="730.0" y="174.33333333333334" font-size="13" text-anchor="middle" fill="#1a1a1a">Secret: JWT_SECRET, DB password</text>
<rect x="600" y="230" width="260" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="730.0" y="254.83333333333334" font-size="13" text-anchor="middle" fill="#1a1a1a">HorizontalPodAutoscaler</text>
<text x="730.0" y="273.83333333333337" font-size="13" text-anchor="middle" fill="#1a1a1a">2 to 6 pods on CPU</text>
<rect x="600" y="310" width="260" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="730.0" y="334.8333333333333" font-size="13" text-anchor="middle" fill="#1a1a1a">PodDisruptionBudget</text>
<text x="730.0" y="353.8333333333333" font-size="13" text-anchor="middle" fill="#1a1a1a">keep at least 1 pod</text>
<line x1="135" y1="120" x2="135" y2="170" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="230" y1="205" x2="300" y2="310" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="200" y="290" font-size="12" text-anchor="middle" fill="#444">label app=trade-service</text>
<line x1="410" y1="130" x2="410" y2="170" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="410" y1="230" x2="350" y2="280" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="410" y1="230" x2="470" y2="280" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="600" y1="90" x2="520" y2="100" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="560" y="80" font-size="12" text-anchor="middle" fill="#444">envFrom (both)</text>
<line x1="600" y1="170" x2="520" y2="118" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="600" y1="260" x2="520" y2="125" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="545" y="215" font-size="12" text-anchor="middle" fill="#444">scales</text>
<text x="450" y="415" font-size="13" text-anchor="middle" fill="#1a1a1a">Postgres and Kafka stay OUTSIDE the cluster here (managed services); the ConfigMap holds their addresses.</text>
</svg>
