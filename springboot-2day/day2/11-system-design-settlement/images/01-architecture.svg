<text x="95.0" y="118.83333333333333" font-size="13" text-anchor="middle" fill="#1a1a1a">REST + ISO 20022 files</text>
<rect x="210" y="70" width="170" height="70" rx="8" fill="#f3edfb" stroke="#7e57c2" stroke-width="2"/>
