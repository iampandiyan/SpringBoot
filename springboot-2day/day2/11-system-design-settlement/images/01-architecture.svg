<text x="880" y="395" font-size="12" text-anchor="middle" fill="#444">statements</text>
<text x="20" y="505" font-size="13" text-anchor="start" fill="#1a1a1a">Business changes and events share one database transaction; everything after Kafka is at-least-once and idempotent.</text>
