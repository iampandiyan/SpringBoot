<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="940" height="360" fill="#ffffff"/>
<text x="470.0" y="30" font-size="20" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Settlement instruction lifecycle (a simplified state machine)</text>
<rect x="20" y="130" width="120" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="80.0" y="164.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">RECEIVED</text>
<rect x="190" y="130" width="120" height="60" rx="8" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
<text x="250.0" y="164.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">VALIDATED</text>
<rect x="360" y="130" width="120" height="60" rx="8" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
<text x="420.0" y="164.66666666666666" font-size="14" text-anchor="middle" fill="#1a1a1a">MATCHED</text>
<rect x="530" y="130" width="140" height="60" rx="8" fill="#fff8e1" stroke="#c79100" stroke-width="2"/>
<text x="600.0" y="154.83333333333334" font-size="13" text-anchor="middle" fill="#1a1a1a">SETTLING</text>
<text x="600.0" y="173.83333333333334" font-size="13" text-anchor="middle" fill="#1a1a1a">(saga running)</text>
<rect x="740" y="60" width="160" height="60" rx="8" fill="#eaf6ec" stroke="#2e8b57" stroke-width="2"/>
<text x="820.0" y="94.66666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">SETTLED</text>
<rect x="740" y="230" width="160" height="60" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
<text x="820.0" y="254.83333333333334" font-size="13" text-anchor="middle" fill="#1a1a1a">FAILED / PENDING</text>
<text x="820.0" y="273.83333333333337" font-size="13" text-anchor="middle" fill="#1a1a1a">retry next cycle</text>
<rect x="190" y="260" width="120" height="50" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
<text x="250.0" y="289.6666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">REJECTED</text>
<rect x="360" y="260" width="120" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="420.0" y="289.6666666666667" font-size="14" text-anchor="middle" fill="#1a1a1a">CANCELLED</text>
<line x1="140" y1="160" x2="190" y2="160" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="310" y1="160" x2="360" y2="160" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="480" y1="160" x2="530" y2="160" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="670" y1="145" x2="740" y2="100" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="690" y="112" font-size="12" text-anchor="middle" fill="#444">all steps ok</text>
<line x1="660" y1="190" x2="740" y2="245" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="745" y="205" font-size="12" text-anchor="middle" fill="#444">step failed</text>
<line x1="250" y1="190" x2="250" y2="260" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="275" y="230" font-size="12" text-anchor="middle" fill="#444">invalid</text>
<line x1="420" y1="190" x2="420" y2="260" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="470" y="232" font-size="12" text-anchor="middle" fill="#444">cancel request</text>
<line x1="740" y1="275" x2="600" y2="190" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="640" y="270" font-size="12" text-anchor="middle" fill="#444">recycle</text>
<text x="20" y="340" font-size="13" text-anchor="start" fill="#1a1a1a">Every arrow is one transactional state change plus one outbox event. Terminal states: SETTLED, REJECTED, CANCELLED.</text>
</svg>
